services:

  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow

    ports:
      - "8080:8080"

    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor

    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ../docker_implementation/data:/opt/airflow/data

    command: >
      bash -c "pip install pandas requests pymysql boto3 psycopg2-binary &&
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Usaid --lastname Ahmed --role Admin --email admin@example.com || true &&
      airflow scheduler &
      sleep 10 &&
      airflow webserver"

  postgres:
    image: postgres:15
    container_name: postgres_warehouse

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: warehouse_db

    ports:
      - "5432:5432"